{% extends "admin_base.html" %}
{% block admin_content %}
<h4>ð 提交记录</h4>
<div style="background:#fff;border-radius:10px;padding:20px;margin-top:16px;box-shadow:0 2px 8px rgba(0,0,0,0.06)">
    <div class="table-responsive">
        <table class="table table-sm table-hover">
            <thead><tr><th>学号</th><th>姓名</th><th>班级</th><th>选择岗位</th><th>提交时间</th></tr></thead>
            <tbody>
            {% for r in rows %}
            <tr>
                <td>{{ r.student_id }}</td>
                <td>{{ r.name }}</td>
                <td>{{ r.class_name or '-' }}</td>
                <td><b>{{ r.base_name }}</b></td>
                <td>{{ r.created_at }}</td>
            </tr>
            {% endfor %}
            </tbody>
        </table>
    </div>
    <div style="color:#95a5a6;font-size:0.85em">共 {{ rows|length }} 条记录</div>
</div>
{% endblock %}
