{% extends "base.html" %}
{% block title %}管理员登录{% endblock %}
{% block body %}
<div class="container">
<div class="row justify-content-center" style="margin-top:100px;">
<div class="col-md-4">
<div class="card p-4">
<h4 class="text-center mb-4"><i class="bi bi-shield-lock"></i> 管理员登录</h4>
{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}{% for cat,msg in messages %}
<div class="alert alert-{{cat}} alert-dismissible fade show">{{msg}}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
{% endfor %}{% endif %}{% endwith %}
<form method="POST">
<div class="mb-3"><label class="form-label">用户名</label><input name="username" class="form-control" required></div>
<div class="mb-3"><label class="form-label">密码</label><input name="password" type="password" class="form-control" required></div>
<button class="btn btn-primary w-100">登录</button>
</form>
<div class="text-center mt-3"><a href="/" class="text-muted">← 学生入口</a></div>
</div></div></div></div>
{% endblock %}
